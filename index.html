<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <ul class="book-grid">
        <li class="book-card">
            <h2 class="book-card-title">Think like a programmer : an introduction to creative problem solving</h2>
            <p class="book-card-author">V. Anton. Spraul</p>
            <p class="book-card-pages">256 sidor</p>
            <button class="book-card-toggle" aria-pressed="false">Läst</button>
            <button class="book-card-remove">Ta bort bok</button>
        </li>
    </ul>

    <button class="add-book">Lägg till ny bok</button>
    
</body>
</html>
